<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>中葡实时同传</title>
    <link rel="stylesheet" href="/styles.css?v=20261109-4" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <h1>AI多语种实时同声传译</h1>
          <p class="summary">自动识别原语，实时输出中文、英语、西班牙语、法语、葡萄牙语等多种语言</p>
        </div>
        <div class="status-card" aria-live="polite">
          <p class="panel-label">运行状态</p>
          <div class="status-panel">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">未开始</span>
          </div>
        </div>
      </section>

      <section class="control-dock" aria-label="Translation controls">
        <div class="dock-section field">
          <label for="targetLanguage">目标语言</label>
          <select id="targetLanguage">
            <option value="pt">葡萄牙语</option>
            <option value="fr">French</option>
            <option value="ja">Japanese</option>
            <option value="ru">Russian</option>
            <option value="zh" selected>中文</option>
            <option value="de">German</option>
            <option value="ko">Korean</option>
            <option value="hi">Hindi</option>
            <option value="id">Indonesian</option>
            <option value="vi">Vietnamese</option>
            <option value="it">Italian</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="dock-section mix-control">
          <div class="mix-heading">
            <label class="range-label" for="audioMix">Audio mix</label>
            <span id="mixValue">85% translated</span>
          </div>
          <input
            id="audioMix"
            type="range"
            min="0"
            max="100"
            step="1"
            value="85"
          />
          <div class="mix-scale" aria-hidden="true">
            <span id="originalMixLabel">Original 15%</span>
            <span id="translatedMixLabel">Translated 85%</span>
          </div>
        </div>

        <div class="dock-section button-row">
          <button id="startButton" type="button">开始</button>
          <button id="stopButton" type="button" class="secondary" disabled>
            停止
          </button>
          <button id="muteButton" type="button" class="secondary" disabled>静音</button>
          <button id="clearButton" type="button" class="secondary">清空</button>
        </div>
      </section>

      <section class="meters" aria-label="Audio status">
        <div class="meter-card">
          <span>输入声音</span>
          <meter id="inputMeter" min="0" max="1" value="0"></meter>
        </div>
      </section>

      <section class="workspace">
        <article class="guide-card diagnostics-card">
          <dl class="diagnostics">
            <div>
              <dt>Capture</dt>
              <dd id="captureState">Not started</dd>
            </div>
            <div>
              <dt>WebRTC state</dt>
              <dd id="chunksSent">new</dd>
            </div>
            <div>
              <dt>Data channel</dt>
              <dd id="activeInputFrames">connecting</dd>
            </div>
            <div>
              <dt>Peak level</dt>
              <dd id="peakInputLevel">0.000</dd>
            </div>
            <div>
              <dt>Remote audio</dt>
              <dd><span id="outputAudioDeltas">0</span> tracks</dd>
            </div>
            <div>
              <dt>Transcript</dt>
              <dd><span id="transcriptDeltas">0</span> deltas</dd>
            </div>
            <div>
              <dt>Last event</dt>
              <dd id="lastEventType">none</dd>
            </div>
          </dl>
        </article>

        <article class="transcript-card">
          <h2>原文识别</h2>
          <div id="sourceTranscript" class="transcript" aria-live="polite"></div>
        </article>

        <article class="transcript-card">
          <h2>实时译文</h2>
          <div id="translatedTranscript" class="transcript" aria-live="polite"></div>
        </article>

        <article class="log-card event-log-card">
          <h2>Event log</h2>
          <div id="eventLog" class="log" aria-live="polite"></div>
        </article>
      </section>
    </main>

    <script src="/app.js?v=20261109-3" type="module"></script>
  </body>
</html>
